modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/plasmoapp/replay-voice-chat/issues"

[[mods]]
modId = "pv-addon-replaymod"
version = "${version}"
displayName = "pv-addon-replaymod"
description = "A compatibility mod between Plasmo Voice and ReForgedPlay (ReplayMod port)"
authors = "Max Henkel, BreadLoaf, Apehum"
logoFile = "assets/replayvoicechat/icon.png"

[[mixins]]
config = "replaymodinterface.mixins.json"

[[mixins]]
config = "replayvoice.mixins.json"

[[dependencies.pv-addon-replaymod]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_dependency}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.pv-addon-replaymod]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.pv-addon-replaymod]]
modId = "replaymod"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.pv-addon-replaymod]]
modId = "plasmovoice"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"
